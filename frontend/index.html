<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= はキャッシュ避け。ブラウザは favicon を強くキャッシュするので、
         アイコンを差し替えたらこの番号を上げること。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=2" />
    <!-- iOS はホーム画面アイコンに SVG を読めないため PNG(180px) を渡す。 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ff7a1a" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- ホーム画面に追加したときのアイコン名。 -->
    <meta name="apple-mobile-web-app-title" content="コエコミ" />
    <title>コエコミ｜声でつくる4コマ劇場</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
